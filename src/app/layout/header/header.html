<div class="header-spacer" aria-hidden="true"></div>
<header
  class="header"
  [class.header--stuck]="scrolled()"
  [class.header--mega]="!!megaLabel()"
  [class.header--hidden]="hidden()"
>
  <div class="header__bar">
    <a class="logo" routerLink="/" aria-label="SIGA, Sistema Integral de Gestión Académica. Helvia Banca, inicio" (click)="closeMega()">
      <img class="logo__sgcp" src="/logo-sgcp.svg" alt="SIGA" width="220" height="46" />
      <span class="logo__text">Helvia</span>
    </a>

    <div class="header__desktop">
      <app-navigation-menu [groups]="groups" [openLabel]="megaLabel()" (openLabelChange)="setMega($event)" />
    </div>

    <div class="header__actions">
      <button type="button" class="util" aria-label="Idioma: Español">
        <span class="util__flag" aria-hidden="true"></span>
        Español
        <app-icon name="chevron" />
      </button>
      @if (session.loggedIn()) {
        <a class="userchip" routerLink="/perfil" (click)="closeMega()">
          <ui-avatar [name]="session.displayName()" size="sm" />
          <span>{{ session.displayName() }}</span>
        </a>
        <button type="button" class="util" (click)="signOut()">Salir</button>
      } @else {
        <button type="button" class="util header__login" (click)="openLogin()">
          Acceso clientes
          <app-icon name="chevron" />
        </button>
      }
      <app-button href="/hazte-cliente" size="sm" (click)="closeMega()">Hazte cliente</app-button>
      <button
        type="button"
        class="header__burger"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-nav"
        aria-label="Abrir menú"
        (click)="toggleMobile()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (openGroup(); as group) {
    <div class="header__mega" [id]="'mega-' + group.label">
      <app-mega-menu [group]="group" (navigated)="closeMega()" />
    </div>
  }
</header>

@if (megaLabel()) {
  <button type="button" class="mega-backdrop" aria-label="Cerrar menú" (click)="closeMega()"></button>
}

<div id="mobile-nav">
  <app-mobile-menu
    [groups]="groups"
    [open]="mobileOpen()"
    (closed)="closeMobile()"
    (loginRequested)="openLogin()"
    (logoutRequested)="signOut()"
  />
</div>

<app-modal [open]="loginOpen()" title="Acceso clientes" (closed)="closeLogin()">
  <form class="login" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
    <p class="login__lead">Entorno de demostración. No introduces credenciales reales.</p>
    <ui-input id="login-user" label="Identificador" [field]="loginForm.controls.user" [error]="userError()" autocomplete="username" />
    <ui-input
      id="login-pass"
      label="Contraseña"
      type="password"
      [field]="loginForm.controls.password"
      [error]="passwordError()"
      autocomplete="current-password"
    />
    @if (loginMessage()) {
      <p class="login__ok" role="status">{{ loginMessage() }}</p>
    }
    <app-button type="submit" [fullWidth]="true">Entrar</app-button>
  </form>
</app-modal>
