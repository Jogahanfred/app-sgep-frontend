<div class="header-spacer" aria-hidden="true"></div>
<header
  class="header"
  [class.header--stuck]="scrolled()"
  [class.header--mega]="!!megaLabel()"
  [class.header--hidden]="hidden()"
>
  <div class="header__bar">
    <a class="logo" routerLink="/" aria-label="SIGA, Sistema Integral de Gestión Académica, inicio" (click)="closeMega()">
      <img class="logo__sgcp" src="/logo-sgcp.svg" alt="SIGA" width="168" height="48" />
    </a>

    <div class="header__desktop">
      <app-navigation-menu
        [groups]="groups"
        [openLabel]="megaLabel()"
        [activeLabel]="activeNavLabel()"
        (openLabelChange)="setMega($event)"
      />
    </div>

    <div class="header__actions">
      @if (session.loggedIn()) {
        @if (contextEmblems().length || showSquadronPicker()) {
          <div class="context-emblems" aria-label="Contexto operativo">
            @for (emblem of contextEmblems(); track emblem.id) {
              <span class="context-emblems__item" [attr.title]="emblem.name">
                <img [src]="emblem.imageUrl" [alt]="emblem.name" />
              </span>
            }
            @if (showSquadronPicker()) {
              <button
                type="button"
                class="context-emblems__item context-emblems__pick"
                [attr.title]="squadronPickerLabel"
                [attr.aria-label]="squadronPickerLabel"
                (click)="openSquadronModal(); $event.stopPropagation()"
              >
                <app-icon name="plus" />
              </button>
            }
          </div>
        }
        <div class="usermenu" [class.usermenu--open]="userMenuOpen()">
          <button
            type="button"
            class="userchip"
            [attr.aria-expanded]="userMenuOpen()"
            aria-haspopup="menu"
            aria-controls="user-menu"
            (click)="toggleUserMenu(); $event.stopPropagation()"
          >
            <ui-avatar [name]="session.displayName()" size="sm" />
            <span>{{ session.displayName() }}</span>
            <svg class="userchip__chev" [class.userchip__chev--up]="userMenuOpen()" viewBox="0 0 12 8" aria-hidden="true">
              <path
                d="M1 1.5 6 6.5 11 1.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          @if (userMenuOpen()) {
            <div id="user-menu" class="usermenu__panel" role="menu">
              <a routerLink="/perfil" role="menuitem" (click)="goProfile()">Mi perfil</a>
              <button type="button" role="menuitem" (click)="signOut()">Cerrar sesión</button>
            </div>
          }
        </div>
      } @else {
        <a [routerLink]="loginRoute" class="util header__login">
          Acceso clientes
          <app-icon name="chevron" />
        </a>
      }
      <button
        type="button"
        class="header__burger"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-nav"
        aria-label="Abrir menú"
        (click)="toggleMobile()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (openGroup(); as group) {
    <div class="header__mega" [id]="'mega-' + group.label">
      <app-mega-menu [group]="group" (navigated)="closeMega()" />
    </div>
  }
</header>

@if (megaLabel()) {
  <button type="button" class="mega-backdrop" aria-label="Cerrar menú" (click)="closeMega()"></button>
}

<div id="mobile-nav">
  <app-mobile-menu
    [groups]="groups"
    [activeLabel]="activeNavLabel()"
    [open]="mobileOpen()"
    (closed)="closeMobile()"
    (loginRequested)="openLogin()"
    (logoutRequested)="signOut()"
  />
</div>

<app-context-squadron-modal [open]="squadronModalOpen()" (closed)="closeSquadronModal()" />
