<div class="app-shell" [class.app-shell--bare]="bareChrome()">
  <app-skip-link />
  @if (!bareChrome()) {
    <app-header />
  }
  <main id="contenido-principal" class="app-shell__main">

  }
  <ui-toast />
</div>
