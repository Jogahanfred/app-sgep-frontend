<div class="ap">
  <div class="ap__head">
    <div>
      <h1>Usuarios</h1>
      <p class="ap__lead">Personas que ingresan al sistema. Alta y edición en pantalla, no en un recuadro.</p>
    </div>
    <app-button href="/catalogo/usuarios/nuevo" icon="plus">Nuevo usuario</app-button>
  </div>

  @if (notice()) {
    <app-alert tone="success">{{ notice() }}</app-alert>
  }

  <div class="ap__toolbar">
    <label class="ap-search">
      <span class="visually-hidden">Buscador global</span>
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Buscar por nombres, apellidos, correo, DNI o indicativo"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>
    <ui-select
      id="user-status-filter"
      label="Estado"
      [uppercase]="false"
      [options]="statusOptions"
      [value]="statusFilter()"
      (valueChange)="statusFilter.set($event === 'all' ? 'all' : $event === 'inactive' ? 'inactive' : 'active')"
    />
  </div>

  @if (loadState() === 'error') {
    <app-alert tone="error">No hemos podido cargar los usuarios. Recarga la página.</app-alert>
  } @else {
    <ui-table
      caption="Usuarios del catálogo"
      [columns]="columns"
      [rows]="tableRows()"
      [loading]="loadState() === 'loading'"
      loadingTitle="Cargando usuarios"
      loadingSubtitle="Estamos trayendo el listado de personas."
      loadingLabel="Cargando usuarios"
      emptyTitle="No hay personas que coincidan con el buscador o el filtro de estado."
    />
  }
</div>
