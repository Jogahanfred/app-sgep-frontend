<div class="ap">
  <p class="ap__lead">
    Administra las personas que ingresan al sistema. El alta rápida se abre en un recuadro; roles y especialidades se
    asignan en la ficha.
  </p>

  @if (notice()) {
    <app-alert tone="success">{{ notice() }}</app-alert>
  }

  <div class="ap__toolbar">
    <label class="ap-search">
      <span class="visually-hidden">Buscador global</span>
      <app-icon name="search" />
      <input
        type="search"
        placeholder="Buscar por nombres, apellidos, correo, DNI o indicativo"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>
    <ui-select
      id="user-status-filter"
      label="Estado"
      size="sm"
      [uppercase]="false"
      [options]="statusOptions"
      [value]="statusFilter()"
      (valueChange)="statusFilter.set($event === 'all' ? 'all' : $event === 'inactive' ? 'inactive' : 'active')"
    />
  </div>

  @if (loadState() === 'error') {
    <app-alert tone="error">No hemos podido cargar los usuarios. Recarga la página.</app-alert>
  } @else {
    <ui-table
      heading="Usuarios"
      caption="Usuarios del catálogo"
      [columns]="columns"
      [rows]="tableRows()"
      [selectedId]="selectedId()"
      [loading]="loadState() === 'loading'"
      loadingTitle="Cargando usuarios"
      loadingSubtitle="Estamos trayendo el listado de personas."
      loadingLabel="Cargando usuarios"
      emptyTitle="No hay personas que coincidan con el buscador o el filtro de estado."
      (selectedIdChange)="selectedId.set($event)"
    >
      <app-button type="button" icon="plus" size="sm" (click)="openCreate()">Añadir</app-button>
      <app-button variant="secondary" size="sm" icon="eye" [disabled]="!selectedId()" (click)="goSelected()">Detalle</app-button>
      <app-button variant="secondary" size="sm" icon="pencil" [disabled]="!selectedId()" (click)="goSelected()">Modificar</app-button>
      <app-button variant="secondary" size="sm" icon="trash" [disabled]="!selectedId()" (click)="deactivateSelected()">Baja</app-button>
    </ui-table>
  }

  <app-user-quick-create [open]="createOpen()" (closed)="closeCreate()" (created)="onCreated()" />
</div>
