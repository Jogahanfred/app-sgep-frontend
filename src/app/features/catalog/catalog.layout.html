<app-container [wide]="true">
  <div class="adm">
    <header class="adm__intro">
      <p class="adm__kicker">Catálogo</p>
      <p class="adm__lead">Personas, roles y especialidades. Tu ficha personal está en Mi perfil.</p>
    </header>

    @if (showDomainNav()) {
      <nav class="adm__nav" aria-label="Catálogo">
        <a routerLink="/catalogo/usuarios" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Usuarios</a>
        <a routerLink="/catalogo/roles" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Roles</a>
        <a routerLink="/catalogo/especialidades" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Especialidades</a>
      </nav>

      <header class="adm__intro">
        <p class="adm__kicker">Estructura operativa</p>
        <p class="adm__lead">Unidades, escuadrones y comisiones temporales. Aquí se configura dónde opera el personal.</p>
      </header>
      <nav class="adm__nav" aria-label="Estructura operativa">
        <a routerLink="/catalogo/unidades" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Unidades</a>
        <a routerLink="/catalogo/escuadrones" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Escuadrones</a>
        <a routerLink="/catalogo/comisiones-temporales" routerLinkActive="adm__link--on" [routerLinkActiveOptions]="{ exact: false }">Comisiones temporales</a>
      </nav>
    }

    <router-outlet />
  </div>
</app-container>
