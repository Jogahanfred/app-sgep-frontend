<app-container [wide]="true">

      <header class="adm__intro">
        <h1 class="adm__kicker">{{ header.title }}</h1>
        <p class="adm__lead">{{ header.lead }}</p>
      </header>
    }

    <router-outlet />
  </div>
</app-container>
