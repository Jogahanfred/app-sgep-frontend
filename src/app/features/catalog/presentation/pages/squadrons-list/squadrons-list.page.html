<div class="ap">
  <p class="ap__lead">Escuadrones adscritos a cada unidad. Código, nombre, descripción y estado.</p>

  <div class="ap__toolbar">
    <ui-input
      id="sq-search"
      label="Buscador global"
      type="search"
      icon="search"
      placeholder="Buscar por unidad, código o nombre"
      [field]="search"
    />
    <ui-select
      id="sq-status-filter"
      label="Estado"
      [uppercase]="false"
      [options]="statusOptions"
      [value]="statusFilter()"
      (valueChange)="statusFilter.set($event === 'all' ? 'all' : $event === 'inactive' ? 'inactive' : 'active')"
    />
  </div>

  @if (loadState() === 'error') {
    <app-alert tone="error">No hemos podido cargar los escuadrones. Recarga la página.</app-alert>
  } @else {
    <ui-table
      heading="Escuadrones"
      caption="Escuadrones"
      [columns]="columns"
      [rows]="tableRows()"
      [selectedId]="selectedId()"
      [loading]="loadState() === 'loading'"
      loadingTitle="Cargando escuadrones"
      loadingSubtitle="Un momento."
      loadingLabel="Cargando escuadrones"
      emptyTitle="No hay resultados con ese buscador o filtro de estado."
      (selectedIdChange)="selectedId.set($event)"
    >
      <app-button [href]="createHref" icon="plus" size="sm">Añadir</app-button>
      <app-button variant="secondary" size="sm" icon="eye" [disabled]="!selectedId()" (click)="goDetail()">Detalle</app-button>
      <app-button variant="secondary" size="sm" icon="pencil" [disabled]="!selectedId()" (click)="goEdit()">Modificar</app-button>
      <app-button variant="secondary" size="sm" icon="trash" [disabled]="!selectedId()" (click)="askDeactivate()">Baja</app-button>
    </ui-table>
  }

  <ui-confirm-dialog
    title="Confirmar baja"
    confirmLabel="Dar de baja"
    [open]="confirmOpen()"
    [message]="confirmMessage()"
    (closed)="closeConfirm()"
    (confirmed)="confirmDeactivate()"
  />
</div>
