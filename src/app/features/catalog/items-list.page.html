<div class="ap">
  <p class="ap__lead">{{ lead }}</p>

  @if (notice()) {
    <app-alert tone="success">{{ notice() }}</app-alert>
  }

  <div class="ap__toolbar">
    <label class="ap-search">
      <span class="visually-hidden">Buscador global</span>
      <app-icon name="search" />
      <input type="search" placeholder="Buscar por nombre o descripción" [value]="query()" (input)="onQuery($event)" />
    </label>
    <ui-select
      id="catalog-status-filter"
      label="Estado"
      size="sm"
      [uppercase]="false"
      [options]="statusOptions"
      [value]="statusFilter()"
      (valueChange)="statusFilter.set($event === 'all' ? 'all' : $event === 'inactive' ? 'inactive' : 'active')"
    />
  </div>

  @if (loadState() === 'error') {
    <app-alert tone="error">No hemos podido cargar el catálogo. Recarga la página.</app-alert>
  } @else {
    <ui-table
      [heading]="title"
      [caption]="title"
      [columns]="columns"
      [rows]="tableRows()"
      [selectedId]="selectedId()"
      [loading]="loadState() === 'loading'"
      [loadingTitle]="'Cargando ' + title.toLowerCase()"
      loadingSubtitle="Un momento."
      [loadingLabel]="'Cargando ' + title"
      emptyTitle="No hay resultados con ese buscador o filtro de estado."
      (selectedIdChange)="selectedId.set($event)"
    >
      <app-button type="button" icon="plus" size="sm" (click)="openCreate()">Añadir</app-button>
      <app-button variant="secondary" size="sm" icon="eye" [disabled]="!selectedId()" (click)="goSelected()">Detalle</app-button>
      <app-button variant="secondary" size="sm" icon="pencil" [disabled]="!selectedId()" (click)="goSelected()">Modificar</app-button>
      <app-button variant="secondary" size="sm" icon="trash" [disabled]="!selectedId()" (click)="deactivateSelected()">Baja</app-button>
    </ui-table>
  }

  <app-item-quick-create
    [kind]="kind"
    [open]="createOpen()"
    (closed)="closeCreate()"
    (created)="onCreated()"
  />
</div>
