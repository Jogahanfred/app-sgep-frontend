<ui-calc-panel>
  <form class="calc" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="calc__grid">
      <div class="calc__fields">
        <ui-input
          id="loan-amount"
          label="¿Cuánto dinero necesitas?"
          type="number"
          appearance="amount"
          [field]="form.controls.amount"
          [min]="amountMin"
          [max]="amountMax"
          [step]="500"
          suffix="€"
          [error]="amountError()"
          info="Importe bruto del préstamo. Ejemplo ilustrativo, no es una oferta."
        />
        <ui-range-slider
          id="loan-amount-slider"
          ariaLabel="Importe del préstamo"
          [value]="form.controls.amount.value"
          [min]="amountMin"
          [max]="amountMax"
          [step]="500"
          [minLabel]="amountMinLabel"
          [maxLabel]="amountMaxLabel"
          (valueChange)="setAmount($event)"
        />

        <ui-input
          id="loan-term"
          label="¿En cuántos meses quieres devolverlo?"
          type="number"
          appearance="amount"
          [field]="form.controls.termMonths"
          [min]="termMin"
          [max]="termMax"
          [step]="6"
          suffix="Meses"
          [error]="termError()"
          [hint]="termYearsHint()"
          info="Plazo total de devolución. Ejemplo ilustrativo."
        />
        <ui-range-slider
          id="loan-term-slider"
          ariaLabel="Plazo del préstamo"
          [value]="form.controls.termMonths.value"
          [min]="termMin"
          [max]="termMax"
          [step]="6"
          minLabel="Mín. 12 meses"
          maxLabel="Máx. 96 meses"
          (valueChange)="setTerm($event)"
        />

        <ui-toggle
          id="loan-sustainable"
          label="¿Es un préstamo sostenible?"
          [checked]="sustainable()"
          info="Marca si el destino es eficiencia energética o movilidad baja en emisiones. No cambia el cálculo de ejemplo."
          (checkedChange)="sustainable.set($event)"
        />
      </div>

      <ui-result-card [amount]="result()?.monthlyPayment ?? null" [rows]="quoteRows()" />
    </div>

    <div class="calc__cta">
      <h3>¿Me aprobarán el préstamo?</h3>
      <app-button href="/hazte-cliente" size="lg">Comienza aquí</app-button>
    </div>
  </form>
</ui-calc-panel>
