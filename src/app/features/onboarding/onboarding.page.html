<app-container>
  <div class="onb">
    <app-breadcrumb [crumbs]="[{ label: 'Hazte cliente' }]" />
    <h1>Hazte cliente de Helvia</h1>
    <p class="onb__lead">
      Formulario de demostración. No se envían datos a ningún servidor. En un banco real, aquí iría la verificación de
      identidad.
    </p>

    @if (sent()) {
      <app-alert tone="success">Hemos registrado tu interés. Un gestor ficticio te escribiría en 24 horas.</app-alert>
    }

    <form class="onb__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-input id="ob-name" label="Nombre y apellidos" [field]="form.controls.name" [error]="fieldError('name')" autocomplete="name" />
      <app-input
        id="ob-email"
        label="Correo electrónico"
        type="email"
        [field]="form.controls.email"
        [error]="fieldError('email')"
        autocomplete="email"
      />
      <app-input
        id="ob-phone"
        label="Teléfono"
        type="tel"
        [field]="form.controls.phone"
        [error]="fieldError('phone')"
        autocomplete="tel"
        hint="Nueve dígitos, sin espacios"
      />
      <app-select id="ob-product" label="Producto de interés" [field]="form.controls.product" [options]="products" />
      <app-button type="submit">Enviar solicitud</app-button>
    </form>
  </div>
</app-container>
