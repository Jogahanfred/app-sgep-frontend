<div
  class="sm"
  [class.sm--sm]="size() === 'sm'"
  [class.sm--lg]="size() === 'lg'"
  [class.sm--compact]="compact()"
  appClickOutside
  (appClickOutside)="close()"
>
  @if (title()) {
    <div class="sm__head">
      @if (icon(); as iconName) {
        <app-icon class="sm__icon" [name]="iconName" />
      }
      <p class="sm__title">{{ title() }}</p>
    </div>
  }
  @if (!compact()) {
    <ui-field-label [label]="label()" [forId]="id()" [required]="required()" [subLabel]="subLabel()" />
  }
  <button
    type="button"
    class="sm__trigger"
    [id]="id()"
    [class.sm__trigger--open]="open()"
    [class.sm__trigger--invalid]="!!error()"
    [disabled]="disabled() || loading()"
    appRipple
    [appRippleDisabled]="disabled() || loading()"
    [attr.aria-expanded]="open()"
    [attr.aria-busy]="loading() || null"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-label]="compact() ? label() : null"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="sm__value">
      @if (leadingIcon(); as lead) {
        <app-icon [name]="lead" />
      }
      <span [class.sm__ph]="!selectedLabel() || loading()">
        {{ loading() ? 'Cargando...' : selectedLabel() || placeholder() }}
      </span>
    </span>
    <svg class="sm__chev" [class.sm__chev--up]="open()" viewBox="0 0 12 8" aria-hidden="true">
      <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  @if (open()) {
    <div class="sm__panel">
      @if (filter()) {
        <input
          class="sm__search"
          type="search"
          [value]="filterQuery()"
          placeholder="Buscar"
          (input)="onFilter($event)"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
        />
      }
      <ul class="sm__list" role="listbox">
        @for (option of visibleOptions(); track option.value) {
          <li>
            <button
              type="button"
              class="sm__opt"
              role="option"
              [attr.aria-selected]="value() === option.value"
              [class.sm__opt--on]="value() === option.value"
              [class.sm__opt--caps]="uppercase()"
              (click)="pick(option)"
            >
              <span>{{ option.label }}</span>
              @if (value() === option.value) {
                <svg class="sm__mark" viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="2.2" y="2.2" width="11.6" height="11.6" />
                  <path d="M6 10.2 10 6" />
                </svg>
              }
            </button>
          </li>
        } @empty {
          <li class="sm__empty">{{ emptyCopy() }}</li>
        }
      </ul>
    </div>
  }
  @if (error(); as message) {
    <ui-error [message]="message" />
  }
</div>
