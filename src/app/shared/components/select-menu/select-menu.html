<div class="sm" appClickOutside (appClickOutside)="close()">
  @if (title()) {
    <div class="sm__head">
      @if (icon(); as iconName) {
        <app-icon class="sm__icon" [name]="iconName" />
      }
      <p class="sm__title">{{ title() }}</p>
    </div>
  }
  <label class="sm__label" [attr.for]="id()">{{ label() }}</label>
  <button
    type="button"
    class="sm__trigger"
    [id]="id()"
    [class.sm__trigger--open]="open()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span [class.sm__ph]="!selectedLabel()">{{ selectedLabel() || placeholder() }}</span>
    <span class="sm__chev" [class.sm__chev--up]="open()" aria-hidden="true"></span>
  </button>
  @if (open()) {
    <ul class="sm__list" role="listbox">
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            class="sm__opt"
            role="option"
            [attr.aria-selected]="value() === option.value"
            [class.sm__opt--on]="value() === option.value"
            [class.sm__opt--caps]="uppercase()"
            (click)="pick(option)"
          >
            <span>{{ option.label }}</span>
            @if (value() === option.value) {
              <span class="sm__check" aria-hidden="true">✓</span>
            }
          </button>
        </li>
      }
    </ul>
  }
  @if (error(); as message) {
    <app-error-hint [message]="message" />
  }
</div>
