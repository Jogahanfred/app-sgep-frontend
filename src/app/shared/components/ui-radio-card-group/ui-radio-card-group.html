<fieldset class="cg" [class.cg--row]="layout() === 'horizontal'">
  <legend class="visually-hidden">{{ question() }}</legend>
  <ui-field-label [label]="question()" [info]="info()" />
  <div class="cg__list" role="radiogroup" [attr.aria-label]="question()">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="cg__opt"
        role="radio"
        [id]="optionId(option)"
        [attr.aria-checked]="value() === option.value"
        [class.cg__opt--on]="value() === option.value"
        (click)="select(option.value)"
      >
        <span class="cg__label">{{ option.label }}</span>
        <span class="cg__radio" aria-hidden="true"></span>
      </button>
    }
  </div>
</fieldset>
