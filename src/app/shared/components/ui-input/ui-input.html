<div class="field" [class.field--error]="!!error()" [class.field--amount]="appearance() === 'amount'">
  <ui-field-label [label]="label()" [info]="info()" [forId]="id()" />
  <div class="field__wrap">
    @if (icon(); as iconName) {
      <app-icon class="field__icon" [name]="iconName" />
    }
    <input
      class="field__control"
      [class.field__control--icon]="!!icon()"
      [id]="id()"
      [attr.type]="type()"
      [formControl]="field()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.autocomplete]="autocomplete()"
      [attr.placeholder]="placeholder()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? id() + '-error' : hint() ? id() + '-hint' : null"
    />
    @if (suffix()) {
      <span class="field__suffix">{{ suffix() }}</span>
    }
  </div>
  @if (hint() && !error()) {
    <p class="field__hint" [id]="id() + '-hint'">{{ hint() }}</p>
  }
  @if (error(); as message) {
    <div [id]="id() + '-error'">
      <ui-error [message]="message" />
    </div>
  }
</div>
