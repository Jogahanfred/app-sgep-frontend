<section class="hero" [class.hero--compact]="compact()" [class.hero--media]="!!image()" aria-labelledby="hero-title">
  @if (image()) {
    <div class="hero__media">
      <img [src]="image()" [alt]="imageAlt()" width="1920" height="1080" />
    </div>
  }
  <app-container>
    <div class="hero__grid" [class.hero__grid--end]="align() === 'end'">
      <div class="hero__copy">
        @if (eyebrow()) {
          <p class="hero__eyebrow">{{ eyebrow() }}</p>
        }
        <h1 id="hero-title">{{ title() }}</h1>
        <p class="hero__sub">{{ subtitle() }}</p>
        <div class="hero__actions">
          <app-button [href]="primaryHref()" size="lg">{{ primaryLabel() }}</app-button>
          @if (secondaryLabel() && secondaryHref()) {
            <app-button [href]="secondaryHref()!" variant="secondary" size="lg">{{ secondaryLabel() }}</app-button>
          }
        </div>
      </div>
    </div>
  </app-container>
</section>
