<div class="toast" aria-live="polite">
  @for (item of toast.messages(); track item.id) {
    <div class="toast__item" [class]="'toast__item--' + item.tone" role="status">
      <app-icon class="toast__icon" [name]="iconOf(item.tone)" />
      <p class="toast__text">{{ item.text }}</p>
      <button type="button" class="toast__close" aria-label="Cerrar aviso" (click)="toast.dismiss(item.id)">
        <app-icon name="close" />
      </button>
    </div>
  }
</div>
